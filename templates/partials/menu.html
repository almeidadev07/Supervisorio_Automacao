<!-- Botão hamburger para mobile -->
<button class="menu-toggle" onclick="toggleMenu()" aria-label="Abrir menu">
    <span></span>
</button>

<!-- Botão de desligar no canto esquerdo -->
<button class="shutdown-btn" onclick="confirmShutdown()" title="Desligar Sistema">
    <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Desliga.png') }}"  class="shutdown-icon">
</button>

<!-- Botões de configuração e reset (apenas para Técnico) -->
<button class="config-btn tecnico-only" onclick="(function(){if(typeof window.showMachineModal === 'function'){window.showMachineModal();}else{const m=document.getElementById('machine-modal');if(m){m.classList.remove('hidden');m.classList.add('show');m.style.display='flex';}}})();" title="Configuração" style="display:none;">
    <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Sinc.png') }}" class="config-icon">
</button>
<button class="reset-btn tecnico-only" onclick="if(typeof window.handleResetClick === 'function') window.handleResetClick(event);" title="Reset Grid" style="display:none;">
    <svg class="reset-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 4V1L8 5L12 9V6C15.31 6 18 8.69 18 12C18 15.31 15.31 18 12 18C8.69 18 6 15.31 6 12H4C4 16.42 7.58 20 12 20C16.42 20 20 16.42 20 12C20 7.58 16.42 4 12 4Z" fill="white"/>
    </svg>
</button>

<nav id="menu">
    <!-- Botões da esquerda - 5 botões -->
    <div class="menu-left" id="menu-operador-left">
        <button class="menu-btn" onclick="showGrid(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Inicio.png') }}" alt="Ícone Início" class="menu-icon">
            <span class="menu-text">Início</span>
        </button>
        <button class="menu-btn" onclick="showAlarm(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Alarme.png') }}" alt="Ícone Alarme" class="menu-icon">
            <span class="menu-text">Alarmes</span>
        </button>
        <button class="menu-btn" onclick="showWeightRange(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Faixa_Peso.png') }}" alt="Ícone Faixa Peso" class="menu-icon">
            <span class="menu-text">Faixa Peso</span>
        </button>
        <button class="menu-btn" onclick="showBalance(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Balanca.png') }}" alt="Ícone Balança" class="menu-icon">
            <span class="menu-text">Balança</span>
        </button>
        <button class="menu-btn" onclick="showClassification(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Classificacao.png') }}" alt="Ícone Classificação" class="menu-icon">
            <span class="menu-text">Classificação</span>
        </button>
    </div>
    
    <!-- Logo central - sempre visível -->
    <button class="logo-btn" onclick="toggleMenu()">
        <img src="{{ url_for('static', filename='images/logos/00_Logo.png') }}" alt="Logo" style="width: 100%; height: 100%;">
    </button>
    
    <!-- Botões da direita - Menu Operador (5 botões) -->
    <div class="menu-right" id="menu-operador">
        <button class="menu-btn" onclick="showGraphics(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Grafico.png') }}" alt="Ícone Gráfico" class="menu-icon">
            <span class="menu-text">Gráficos</span>
        </button>
        <button class="menu-btn" onclick="showWasher(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Lavadora.png') }}" alt="Ícone Lavadora" class="menu-icon">
            <span class="menu-text">Lavadora</span>
        </button>
        <button class="menu-btn" onclick="showDryer(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Secadora.png') }}" alt="Ícone Secadora" class="menu-icon">
            <span class="menu-text">Secadora</span>
        </button>
        <button class="menu-btn" onclick="showSamples(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Amostras.png') }}" alt="Ícone Amostras" class="menu-icon">
            <span class="menu-text">Amostras</span>
        </button>
        <button class="menu-btn" onclick="showDiagram(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Diagrama_Eletrico.png') }}" alt="Diagrama Elétrico" class="menu-icon">
            <span class="menu-text">Diagramas</span>
        </button>
    </div>

    <!-- Menu Técnico - Esquerda (3 botões) -->
    <div class="menu-left" id="menu-tecnico-left" style="display: none;">
        <button class="menu-btn menu-btn-tecnico" onclick="showSynchronism(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Sinc.png') }}" alt="Sincronismo" class="menu-icon">
            <span class="menu-text">Sincronismo</span>
        </button>
        <button class="menu-btn menu-btn-tecnico" onclick="showWindows(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Janela.png') }}" alt="Ícone Janela" class="menu-icon">
            <span class="menu-text">Janelas</span>
        </button>
        <button class="menu-btn menu-btn-tecnico" onclick="showSolenoids(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Acionamento.png') }}" alt="Ícone Acionamento" class="menu-icon">
            <span class="menu-text">Solenoides</span>
        </button>
    </div>

    <!-- Menu Técnico - Direita (3 botões) -->
    <div class="menu-right" id="menu-tecnico-right" style="display: none;">
        <button class="menu-btn menu-btn-tecnico" onclick="showPanels(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Painel.png') }}" alt="Ícone Painel" class="menu-icon">
            <span class="menu-text">Painéis</span>
        </button>
        <button class="menu-btn menu-btn-tecnico" onclick="zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Placas.png') }}" alt="Ícone Placas" class="menu-icon">
            <span class="menu-text">Placas</span>
        </button>
        <button class="menu-btn menu-btn-tecnico" onclick="showInformation(event);zoomButton(this)">
            <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Informacao.png') }}" alt="Ícone Informação" class="menu-icon">
            <span class="menu-text">Informações</span>
        </button>
    </div>
</nav>

<!-- Menu Carrossel para Mobile - Logo Fixo no Centro -->
<div class="menu-carousel-wrapper" id="menu-carousel-wrapper">
    <!-- Seta esquerda -->
    <button class="carousel-arrow carousel-arrow-left" onclick="scrollCarouselLeft()" aria-label="Anterior">
        ‹
    </button>
    
    <div class="menu-carousel">
        <!-- Track esquerdo (botões da esquerda) -->
        <div class="menu-carousel-track-left" id="carousel-track-left">
            <div class="carousel-buttons-container" id="carousel-left-buttons">
                <!-- Botões serão clonados aqui via JS -->
            </div>
        </div>
        
        <!-- Logo fixo no centro -->
        <button class="carousel-center-logo" onclick="toggleMenu()">
            <img src="{{ url_for('static', filename='images/logos/00_Logo.png') }}" alt="Logo">
        </button>
        
        <!-- Track direito (botões da direita) -->
        <div class="menu-carousel-track-right" id="carousel-track-right">
            <div class="carousel-buttons-container" id="carousel-right-buttons">
                <!-- Botões serão clonados aqui via JS -->
            </div>
        </div>
    </div>
    
    <!-- Seta direita -->
    <button class="carousel-arrow carousel-arrow-right" onclick="scrollCarouselRight()" aria-label="Próximo">
        ›
    </button>
</div>
