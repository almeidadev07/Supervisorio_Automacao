<section id="grid-container">
        <!-- Botões modulares -->
    <!-- Botões com velocímetros ---->
    <button class="draggable-btn" draggable="true" data-station="velocidade-real">
        <!-- Velocidade Real -->
        <div class="unit">
            <h2>Velocidade Real</h2>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                <div class="velocimetro-container">
                    <img src="{{ url_for('static', filename='images/grid/status/00_Medida_Velocimentro_Verde.png') }}" class="velocimetro-imagem" id="imgVelocimetroReal">
                    <img src="{{ url_for('static', filename='images/grid/status/00_Ponteiro_Velocimentro_Verde.png') }}"class="ponteiro" id="ponteiroReal" data-tipo="real">
                </div>
                <div class="velocimetro-value-container">
                    <span id="valorReal" class="velocimetro-valor">0</span>
                    <span class="unidade-real">Cx/h</span>
                </div>
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="velocidade-prog">
        <!-- Velocidade Prog. -->
        <div class="unit">
            <h2>Velocidade Prog.</h2>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                <div class="velocimetro-container">
                    <img src="{{ url_for('static', filename='images/grid/status/00_Medida_Velocimentro_Amarelo.png') }}" class="velocimetro-imagem" id="imgVelocimetroProg">
                    <img src="{{ url_for('static', filename='images/grid/status/00_Ponteiro_Velocimentro_Amarelo.png') }}" class="ponteiro" id="ponteiroProg">
                </div>
                <div class="velocimetro-value-container">
                    <input type="text" id="velocidadeInput" class="velocimetro-input" value="50" readonly onclick="abrirTeclado(event)">
                    <span class="unidade-programada">Cx/h</span>
                </div>
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="alarmes">
        <!-- Alarmes -->
        <div class="unit">
            <h2>Alarmes</h2>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                <div class="alarm-counts-container">
                    <div class="alarm-count-circle emergency" data-type="emergency">
                        <span class="count-value">000</span>
                        <span class="alarm-label">Emergência</span>
                    </div>
                    <div class="alarm-count-circle nr12" data-type="nr12">
                        <span class="count-value">000</span>
                        <span class="alarm-label">NR12</span>
                    </div>
                    <div class="alarm-count-circle drives" data-type="drives">
                        <span class="count-value">000</span>
                        <span class="alarm-label">Drives</span>
                    </div>
                    <div class="alarm-count-circle thermal" data-type="thermal">
                        <span class="count-value">000</span>
                        <span class="alarm-label">Térmicos</span>
                    </div>
                    <div class="alarm-count-circle hardware" data-type="hardware">
                        <span class="count-value">000</span>
                        <span class="alarm-label">Hardware</span>
                    </div>
                    <div class="alarm-count-circle process" data-type="process">
                        <span class="count-value">000</span>
                        <span class="alarm-label">Processo</span>
                    </div>
                    <div class="alarm-count-circle alimentador" data-type="alimentador" data-visible="true">
                        <span class="count-value">00</span>
                        <span class="alarm-label">Aliment.</span>
                    </div>
                    <div class="alarm-count-circle total" data-type="total">
                        <span class="count-value">000</span>
                        <span class="alarm-label">Total</span>
                    </div>
                </div>
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="plasson-farm">
        <!-- Plasson Farm -->
         <div class="unit">
             <h2>Plasson Farm</h2>
             <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                <img src="{{ url_for('static', filename='images/menu/icons/00_Icone_Relatorio.png') }}"
                     data-dark-src="{{ url_for('static', filename='images/menu/icons/00_Icone_Relatorio.png') }}"
                     data-light-src="{{ url_for('static', filename='images/menu/icons/00_Icone_Relatorio_cinza.png') }}"
                     alt="Ícone Relatório"
                     class="menu-icon_farm">
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="acumuladora">
        <!-- Acumuladora -->
        <div class="unit">
            <h2>Acumuladora</h2>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                <div class="pie-gauge" id="gauge1">
                    <span class="pie-gauge-value" id="gaugeVal1">0%</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 8px;">
                    <div class="jog-switch" style="flex:1; text-align:left;">
                        <input type="checkbox" id="jog1" class="toggle"/>
                        <label for="jog1">Jog</label>
                    </div>
                    <div class="slider-wrapper" style="flex:2; text-align:right;">
                        <input type="range" min="0" max="100" value="0" class="slider" id="slider1" style="width: 160px; display:inline-block; vertical-align:middle;"/>
                    </div>
                </div>
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="dosificadora">
        <!-- Dosificadora -->
         <div class="unit">
             <h2>Dosificadora</h2>
             <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                 <div class="pie-gauge" id="gauge2">
                     <span class="pie-gauge-value" id="gaugeVal2">0%</span>
                 </div>
                 <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 8px;">
                     <div class="jog-switch" style="flex:1; text-align:left;">
                         <input type="checkbox" id="jog2" class="toggle"/>
                         <label for="jog2">Jog</label>
                     </div>
                     <div class="slider-wrapper" style="flex:2; text-align:right;">
                        <input type="range" min="0" max="100" value="0" class="slider" id="slider2" style="width: 160px; display:inline-block; vertical-align:middle;"/>
                     </div>
                 </div>
             </div>
         </div>
    </button>
    
    <button class="draggable-btn" draggable="true" data-station="escova">
        <!-- Escova -->
         <div class="unit">
             <h2>Escova</h2>
             <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                 <div class="pie-gauge" id="gauge3">
                     <span class="pie-gauge-value" id="gaugeVal3">0%</span>
                 </div>
                 <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 8px;">
                     <div class="jog-switch" style="flex:1; text-align:left;">
                         <input type="checkbox" id="jog3" class="toggle"/>
                         <label for="jog3">Jog</label>
                     </div>
                     <div class="slider-wrapper" style="flex:2; text-align:right;">
                        <input type="range" min="0" max="100" value="0" class="slider" id="slider3" style="width: 160px; display:inline-block; vertical-align:middle;"/>
                     </div>
                 </div>
             </div>
         </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="data-hora">
        <!-- Data e Hora -->
        <div class="unit">
            <h2>Data e Hora</h2>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                <div class="datetime-container">
                    <div class="time-display" id="current-time">--:--:--</div>
                    <div class="date-display" id="current-date">--/--/----</div>
                </div>
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="botao-9">
        <!-- Periféricos pequenos (Grid 9) -->
        <div class="unit">
            <h2>Periféricos</h2>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                <div class="peripherals-container" style="grid-template-columns: repeat(3, 1fr);">
                    <div class="peripheral-item">
                        <div class="peripheral-label" id="label-ovoscopia">Ovoscopia</div>
                        <div class="peripheral-btn btn-icon" id="btn-ovoscopia-toggle" data-role="ovoscopia" role="button" tabindex="0"></div>
                    </div>
                    <div class="peripheral-item">
                        <div class="peripheral-label" id="label-crack">Crack</div>
                        <div class="peripheral-btn btn-icon" id="btn-crack-toggle" data-role="crack" role="button" tabindex="0"></div>
                    </div>
                    <div class="peripheral-item">
                        <div class="peripheral-label" id="label-nebulizador-oleo">Nebulizador Óleo</div>
                        <div class="peripheral-btn btn-icon" id="btn-nebulizador-oleo-toggle" data-role="nebulizador-oleo" role="button" tabindex="0"></div>
                    </div>
                    <div class="peripheral-item">
                        <div class="peripheral-label" id="label-lampadas-uv">Lâmpadas UV</div>
                        <div class="peripheral-btn btn-icon" id="btn-lampadas-uv-toggle" data-role="lampadas-uv" role="button" tabindex="0"></div>
                    </div>
                    <div class="peripheral-item">
                        <div class="peripheral-label" id="label-escova-manual">Escova Manual</div>
                        <div class="escova-power-container">
                            <div class="peripheral-btn btn-icon" id="btn-escova-manual-toggle" data-role="escova-manual" role="button" tabindex="0"></div>
                            <!-- Botão Liga/Desliga (funciona como peripheral-btn) -->
                            <div class="peripheral-btn btn-icon" id="btn-power-toggle" data-role="power-switch" role="button" tabindex="0" title="Liga/Desliga"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="botao-10">
        <div class="unit">
            <h2 class="graphics-summary-title">Resumo Gráfico (Classes)</h2>
            <div class="mini-classes-chart-container">
                <canvas id="mini-classes-chart"></canvas>
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="botao-11" onclick="showViewer3D(event)">
        <div class="unit">
            <h2>Visualizador 3D</h2>
            <div class="viewer3d-grid-preview">
                <img src="{{ url_for('static', filename='images/grid/status/embaladora.png') }}" alt="Visualizador 3D" class="viewer3d-grid-preview-img">
            </div>
        </div>
    </button>
    <button class="draggable-btn" draggable="true" data-station="botao-12">12</button>
</section>
<div id="grid-focus-mask" class="grid-focus-mask" aria-hidden="true"></div>
