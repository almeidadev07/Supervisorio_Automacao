<!-- partials/washer.html - Versão Corrigida -->
<div class="washer-screen-layout">
    <!-- Header com título -->
    <div class="washer-header-box">
        <h2 class="washer-title">Lavadora</h2>
    </div>

                <div class="motor-unit" id="sugador-gotas">
                    <h3>Sugador de Gotas</h3>
                    <div class="motor-visual" style="position:relative; width:84px; height:84px; margin:8px auto;">
                        <img class="motor-gray" src="{{ url_for('static', filename='images/pages/icons/comandos/00 - Motor Cinza.png') }}" alt="Motor Cinza" style="position:absolute; inset:0; width:84px; height:84px; display:block;" />
                        <img class="motor-green" src="{{ url_for('static', filename='images/pages/icons/comandos/00 - Motor Verde.png') }}" alt="Motor Verde" style="position:absolute; inset:0; width:84px; height:84px; display:none;" />

                        <img class="motor-red" src="{{ url_for('static', filename='images/pages/icons/comandos/00 - Motor Vermelho.png') }}" alt="Motor Vermelho" style="position:absolute; inset:0; width:84px; height:84px; display:none;" />
                    </div>
                    <div class="controls-row">
                        <div class="mode-toggle">
                            <img class="mode-auto" src="{{ url_for('static', filename='images/pages/icons/comandos/00 - Botão_Auto.png') }}" alt="Auto" />
                            <img class="mode-manual" src="{{ url_for('static', filename='images/pages/icons/comandos/00 - Botão_Manual.png') }}" alt="Manual" />

                        <div class="power-toggle">
                            <img class="power-on" src="{{ url_for('static', filename='images/pages/icons/comandos/00 - Botão_Liga_Ligado.png') }}" alt="Ligado" />
                            <img class="power-off" src="{{ url_for('static', filename='images/pages/icons/comandos/00 - Botão_Liga_Desligado.png') }}" alt="Desligado" />
                        </div>
                    </div>
